[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "taosentinel"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx>=0.27,<1.0",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.3,<3.0",
  "APScheduler>=3.10,<4.0",
  "aiosqlite>=0.20,<1.0",
  "fastapi>=0.111,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "feedparser>=6.0,<7.0",
  "trafilatura>=2.0,<3.0",
  "python-dateutil>=2.9,<3.0",
  "discord.py>=2.4,<3",            # 08 discord_gateway (Phase 6); imported lazily by that module only
  "xxhash>=3.4",                   # 04 twox128 storage-key prefix (SubnetIdentitiesV3)
  "cryptography>=42,<47",          # 07 TLS certificate parsing (not_valid_after_utc)
  "tld>=0.13,<1.0",                # 07 registrable domain (offline PSL; already pulled in by trafilatura → courlan)
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<9.0", "pytest-asyncio>=0.23,<2.0", "respx>=0.21,<1.0"]
backfill = ["async-substrate-interface>=2.2,<3", "xxhash>=3"]      # 17 §8.1; imported lazily by app/backfill/rpc_client.py
llm = ["anthropic>=1.15,<2"]                                         # 10 / 19 §2.7; imported lazily (vision read, Phase 9)

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.setuptools.package-data]
"app.storage" = ["models.sql", "migrations/*.sql", "migrations/README.md"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
markers = [
  "smoke: boots the runtime in-process; fast critical path (< 45 s)",
  "network: touches the real internet (skipped unless TAOSENTINEL_NETWORK_TESTS=1)",
]
